<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勇者ジル3">
<title>勇者ジル 第三部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 一画面ゲーム：ドット絵フィールド＋3D戦闘。単一の夜色テーマで固定 */
:root{
  --night:#0b0d1a; --win:#0a0c1c; --line:#ece6d4; --ink:#f4efe2; --dim:#a9a6b8;
  --gold:#e9b949; --crimson:#b01e2e; --blue:#3a63d6; --hp:#5fd17a; --sp:#58b6ff; --danger:#ff5a5a;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#field{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#battle{position:absolute;inset:0}
#battle canvas{position:absolute;inset:0;width:100%!important;height:100%!important;image-rendering:pixelated}
#cg{position:absolute;inset:0;z-index:52;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}#cg.on{opacity:1}
#cg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;opacity:0;transition:opacity .9s}#cg img.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .4s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:49}
.win{background:var(--win);border:3px solid var(--line);border-radius:7px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000,0 6px 18px rgba(0,0,0,.5)}
#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),760px);box-sizing:border-box;min-height:6.2em;padding:14px 20px 16px;font-size:clamp(15px,2.3vw,21px);line-height:1.65;z-index:54;white-space:pre-wrap}
#msg .name{position:absolute;top:-16px;left:14px;background:var(--win);border:2px solid var(--line);border-radius:5px;padding:1px 10px;font-size:.85em;color:var(--gold)}
#msg .face{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:5.2em;height:5.2em;max-height:calc(100% - 16px);aspect-ratio:1;background:#000 url(faces.jpg) no-repeat;background-size:600% 700%;border:2px solid var(--line);border-radius:6px;box-sizing:border-box}
#msg.has-face{padding-left:calc(5.2em + 30px)}body.is-touch.land #msg.has-face{padding-left:calc(5.2em + 30px)}#msg.has-face .name{left:calc(5.2em + 24px)}
#msg .arrow{position:absolute;right:14px;bottom:6px;animation:bob .6s infinite alternate;color:var(--gold)}
@keyframes bob{to{transform:translateY(4px)}}
.list{position:absolute;z-index:54;padding:10px 6px;font-size:clamp(15px,2.2vw,20px);min-width:180px;max-width:calc(100% - 32px);max-height:calc(100% - 24px);overflow-y:auto;box-sizing:border-box}
.list .ttl{padding:0 14px 6px;color:var(--gold);font-size:.85em}
.list .it{padding:4px 14px 4px 30px;position:relative;display:flex;gap:18px;justify-content:space-between;cursor:pointer;white-space:nowrap}
.list .it.sel::before{content:"▶";position:absolute;left:8px;color:var(--ink);animation:blink .8s steps(2) infinite}
.list .it.dis{color:#6d6a7c}
.list .it .sub{color:var(--dim)}
@keyframes blink{50%{opacity:.2}}
#flabels{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.flabel{position:absolute;transform:translate(-50%,-50%);padding:1px 7px;background:rgba(10,12,28,.82);border:1px solid var(--gold);border-radius:4px;color:var(--ink);white-space:nowrap;line-height:1.35}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:20}
#obj{padding:6px 12px;font-size:clamp(12px,1.8vw,16px);max-width:60%}
#obj b{color:var(--gold);font-weight:normal;margin-right:6px}
#stat{padding:6px 12px;font-size:clamp(12px,1.8vw,16px);text-align:right;line-height:1.4;font-variant-numeric:tabular-nums}
#stat .g{color:var(--gold)}
#card{position:absolute;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
#card .big{font-size:clamp(26px,5vw,46px);letter-spacing:.12em;text-wrap:balance}
#card .small{font-size:clamp(14px,2.4vw,20px);color:var(--dim);letter-spacing:.1em;white-space:pre-line;line-height:1.9}
#card .big,#card .small{opacity:0;transition:opacity 1.2s}
#card.on .big,#card.on .small{opacity:1}
#tut{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:55;width:min(calc(100% - 32px),560px);max-height:calc(100% - 20px);overflow-y:auto;box-sizing:border-box;padding:18px 22px;font-size:clamp(14px,2.1vw,18px);line-height:1.7}
#tut h3{margin:0 0 8px;font-weight:normal;color:var(--gold);font-size:1.1em}
#tut .k{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:0 2px;color:#fff;background:#23263d}
#tut .ok{margin-top:10px;text-align:right;color:var(--dim);font-size:.85em}
/* title */
#title{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:#05060c}
#title .bg{position:absolute;inset:0;background:url(worldmap.jpg) center/cover;opacity:.32;filter:saturate(.8);image-rendering:pixelated;animation:pan 40s linear infinite alternate}
@keyframes pan{from{transform:scale(1.08) translateX(-2%)}to{transform:scale(1.08) translateX(2%)}}
#title .logo{position:relative;text-align:center}
#title .logo .sub1{font-size:clamp(13px,2vw,18px);letter-spacing:.4em;color:var(--dim)}
#title .logo h1{margin:.1em 0;font-weight:normal;font-size:clamp(56px,13vw,120px);letter-spacing:.08em;color:#fff;text-shadow:0 0 0 #000,4px 4px 0 #1d3a8f,8px 8px 0 #000}
#title .logo .sub2{font-size:clamp(14px,2.4vw,22px);letter-spacing:.2em;color:#d9c48a}
#title .menu{position:relative}
#title .menu .list{position:relative}
#installBtn{position:relative;font-family:var(--font);font-size:15px;color:var(--ink);background:rgba(10,12,28,.8);border:2px solid var(--gold);border-radius:6px;padding:8px 16px;cursor:pointer}
#installBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#title .foot{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:#6d6a7c;letter-spacing:.1em}
/* battle hud */
#bhud{position:absolute;inset:0;pointer-events:none;z-index:20}
#bhud .me{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:8px 12px;min-width:220px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#20222f;border:1px solid #000;border-radius:2px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .15s}
.bar.sp>i{background:var(--sp)}
.bar.mp>i{background:#c27bff}
body:not(.has-magic) #bhud .mprow,body:not(.has-magic) #bhud .bar.mp{display:none!important}
.dmg.m{color:#ffa94a;font-size:24px}
.bar.sp.full>i{background:linear-gradient(90deg,var(--sp),#b9e6ff,var(--sp));background-size:200% 100%;animation:shine 1s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
#bhud .row{display:flex;justify-content:space-between;font-size:14px}
#bhud .row .lv{color:var(--gold)}
#bhud .herb{font-size:13px;color:var(--dim);white-space:normal}
#bhud .me{max-width:min(44vw,330px)}
body.is-touch #bhud .me{min-width:0;width:min(34vw,210px);padding:5px 9px;opacity:.92}body.is-touch #bhud .row{font-size:12px}body.is-touch #bhud .bar{height:6px;margin:2px 0 3px}body.is-touch #bhud .herb{font-size:11px;line-height:1.35}body.is-touch #bhud .party .pm{font-size:11px;gap:4px}body.is-touch #bhud .party .pm .bar{height:4px}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,6vw,54px);letter-spacing:.15em;color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;opacity:0;transition:opacity .25s,transform .25s;transform:scale(1.2)}
#banner.on{opacity:1;transform:scale(1)}
#btut{position:absolute;left:50%;transform:translateX(-50%);top:calc(168px + env(safe-area-inset-top,0px));width:min(calc(100% - 32px),640px);box-sizing:border-box;padding:10px 16px;font-size:clamp(13px,2vw,17px);line-height:1.6;text-align:center}
#btut b{color:var(--gold);font-weight:normal}
.ebar{position:absolute;transform:translate(-50%,-100%);font-size:12px;text-align:center;width:130px;white-space:nowrap;text-shadow:1px 1px 0 #000}
.ebar .bar{height:6px;margin:2px 0 0}
.ebar .bar>i{background:var(--danger)}
.ebar.alert .nm{color:#ffd24a}
.dmg{position:absolute;transform:translate(-50%,-50%);font-size:22px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;white-space:nowrap;font-variant-numeric:tabular-nums}
.dmg.p{color:#ff6b6b}.dmg.c{color:#ffd24a;font-size:26px}.dmg.g{color:#9fe3ff}.dmg.h{color:#7dff9a}
#slowfx{position:absolute;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .2s;box-shadow:inset 0 0 120px 30px rgba(80,160,255,.55);background:rgba(40,80,160,.12)}
#carry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;width:min(calc(100% - 32px),620px);box-sizing:border-box;padding:16px 18px;font-size:15px;line-height:1.6}#carry b{color:var(--gold)}#carry textarea{width:100%;height:110px;box-sizing:border-box;font-family:monospace;font-size:12px;background:#0b0c18;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px;word-break:break-all}#carry .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}#carry button{font-family:var(--font);font-size:15px;color:var(--ink);background:rgba(10,12,28,.85);border:2px solid var(--gold);border-radius:6px;padding:6px 16px;cursor:pointer}
#chess{position:absolute;inset:0;z-index:58;background:rgba(6,6,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}#chess .chhead{padding:4px 12px;font-size:14px;text-align:center;position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:2;white-space:nowrap;text-align:left}#chess .chbtns{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2}#chess .chhead b{color:var(--gold);font-weight:normal;display:block}#chess canvas{border:3px solid #5a3a1e;border-radius:6px;touch-action:none}#chess .chbtns button{font-family:var(--font);font-size:14px;color:var(--ink);background:rgba(10,12,28,.85);border:2px solid var(--line);border-radius:6px;padding:4px 14px;cursor:pointer}
#shopdesc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),640px);box-sizing:border-box;padding:10px 16px;font-size:clamp(14px,2vw,18px);z-index:54}body.is-touch #shopdesc{bottom:calc(200px + env(safe-area-inset-bottom,0px))}body.is-touch.land #shopdesc{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 400px);min-width:280px;font-size:14px}
#pause{position:absolute;inset:0;z-index:44;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
/* touch */
.touch{position:absolute;inset:0;pointer-events:none;z-index:35;display:none}
body.is-touch .touch.show{display:block}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(20,22,40,.55);border:2px solid rgba(236,230,212,.6);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:15px;touch-action:none}
.tbtn.on{background:rgba(233,185,73,.45)}
.dpad{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:150px;height:150px}
.dpad .tbtn{width:52px;height:52px;border-radius:10px;font-size:18px}
.dpad .u{left:49px;top:0}.dpad .d{left:49px;bottom:0}.dpad .l{left:0;top:49px}.dpad .r{right:0;top:49px}
.rbtns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:190px;height:170px}
#touch-field .a{width:72px;height:72px;right:0;bottom:30px}
#touch-field .b{width:56px;height:56px;right:86px;bottom:0;font-size:13px}
#touch-battle .atk{width:84px;height:84px;right:0;bottom:10px;font-size:17px}
#touch-battle .ddg{width:60px;height:60px;right:96px;bottom:0}
#touch-battle .grd{width:60px;height:60px;right:20px;bottom:104px}
#touch-battle .skl{width:56px;height:56px;right:100px;bottom:76px}
#touch-battle .itm{width:44px;height:44px;right:166px;bottom:120px;font-size:12px}
#touch-battle .mag{width:54px;height:54px;right:172px;bottom:44px;font-size:13px;display:none}
body.has-magic #touch-battle .mag{display:flex}
#touch-battle .swc{width:50px;height:50px;right:170px;bottom:112px;font-size:13px;display:none}body.has-party #touch-battle .swc{display:flex}body.has-party #touch-battle .itm{right:228px;bottom:60px}
#bhud .party{margin-top:4px;display:none}#bhud.multi .party{display:block}#bhud .party .pm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}#bhud .party .pm.cur{color:var(--gold)}#bhud .party .pm .bar{flex:1;height:5px;margin:2px 0}#bhud .party .pm.down{opacity:.45}
#bhud.girl .mprow,#bhud.girl .bar.mp{display:flex!important}#bhud.girl .bar.mp{display:block!important}#bhud.girl .sprow,#bhud.girl .bar.sp{display:none}
#touch-battle .pse{width:44px;height:44px;right:max(14px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;font-size:12px;position:fixed}
#joy{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none}
#joyb{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(236,230,212,.45);background:rgba(20,22,40,.35);display:none;pointer-events:none}
#joyk{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(236,230,212,.55)}
#menuBtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:auto;height:auto;padding:6px 12px;border-radius:6px;font-size:13px}
body.is-touch #msg{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.is-touch.land #msg{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 400px);min-width:300px;font-size:16px;min-height:5.2em;padding:12px 16px}
body.is-touch.land #tut{font-size:14px;line-height:1.55;padding:14px 18px}
body.is-touch.land .list{font-size:16px}
#mute{position:absolute;z-index:80;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-family:var(--font);background:rgba(10,12,28,.7);color:var(--dim);border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:12px;cursor:pointer}
body.is-touch #mute{right:auto;left:50%;transform:translateX(-50%)}
#mapview{position:absolute;inset:0;z-index:58;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#mapview img{max-width:100%;max-height:100%;border:3px solid var(--line);border-radius:6px;image-rendering:auto}
@media (prefers-reduced-motion:reduce){#title .bg{animation:none}#msg .arrow{animation:none}}
</style>
</head>
<body>


<div id="app">
  <canvas id="field" width="240" height="208"></canvas>
  <div id="battle" hidden></div>
  <div id="slowfx"></div>
  <div id="hud" hidden>
    <div id="obj" class="win"><b>目的</b><span></span></div>
    <div id="stat" class="win"></div>
  </div>
  <div id="bhud" hidden>
    <div class="me win">
      <div class="row"><span class="nmx">ジル</span><span class="lv"></span></div>
      <div class="row"><span>HP</span><span class="hpn"></span></div>
      <div class="bar"><i class="hpb"></i></div>
      <div class="row sprow"><span>SP</span><span class="spn"></span></div>
      <div class="bar sp"><i class="spb"></i></div>
      <div class="row mprow"><span>MP</span><span class="mpn"></span></div>
      <div class="bar mp"><i class="mpb"></i></div>
      <div class="herb"></div>
      <div class="party"></div>
    </div>
    <div id="ebars"></div>
    <div id="dmgs"></div>
    <div id="btut" class="win" hidden></div>
    <div id="banner"></div>
  </div>
  <div id="msg" class="win" hidden><div class="face" hidden></div><div class="name"></div><div class="text"></div><div class="arrow">▼</div></div>
  <div id="flabels"></div>
  <div id="lists"></div>
  <div id="tut" class="win" hidden></div>
  <div id="card" hidden><div class="big"></div><div class="small"></div></div>
  <div id="mapview" hidden><img src="worldmap.jpg" alt="イルヴィア大陸 世界地図"></div>

  <div id="touch-field" class="touch">
    <div class="dpad">
      <div class="tbtn u" data-act="up">▲</div><div class="tbtn d" data-act="down">▼</div>
      <div class="tbtn l" data-act="left">◀</div><div class="tbtn r" data-act="right">▶</div>
    </div>
    <div class="rbtns">
      <div class="tbtn a" data-act="ok">A<br>決定</div>
      <div class="tbtn b" data-act="cancel menu">B<br>戻る</div>
    </div>
  </div>
  <div id="touch-battle" class="touch">
    <div id="joy"><div id="joyb"><div id="joyk"></div></div></div>
    <div class="rbtns">
      <div class="tbtn atk" data-act="atk">攻撃</div>
      <div class="tbtn grd" data-act="guard">ガード</div>
      <div class="tbtn ddg" data-act="dodge">回避</div>
      <div class="tbtn skl" data-act="skill">スキル</div>
      <div class="tbtn itm" data-act="item">薬</div>
      <div class="tbtn mag" data-act="magic">魔法</div>
      <div class="tbtn swc" data-act="switch">交代</div>
    </div>
    <div class="tbtn pse" data-act="pause">||</div>
  </div>

  <div id="title">
    <div class="bg"></div>
    <div class="logo">
      <div class="sub1">イルヴィア大陸 戦記</div>
      <h1>勇者ジル</h1>
      <div class="sub2">第一部 ― 蒼き剣の継承者 ―</div>
    </div>
    <div class="menu" id="titleMenu"></div>
    <button id="installBtn" type="button" hidden>アプリとしてインストール</button>
    <div class="foot">キーボード・ゲームパッド・タッチ対応</div>
  </div>
  <div id="cg"><img alt=""><img alt=""></div>
  <div id="fade"></div>
  <div id="flash"></div>
  <button id="mute" type="button">♪ ON</button>
</div>

<script src="three.min.js"></script>
<script>
'use strict';
const DISK=2; /* 第三部（ディスク2）の書き出しでは 2 になる */
/* =========================================================
   勇者ジル  第一部（第1章〜第2章）
   ・フィールド：ドラクエ1風ドット絵（Canvas 2D）
   ・戦闘：紅盤の歩風 3Dアクション（Three.js）
   ========================================================= */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function playMusic(name,opt={}){
  if(AU.cur===name)return;stopMusic();AU.cur=name;if(!name)return;
  if(BGM_FILES[name]){const a=AU.files&&AU.files[name];if(a&&!AU.muted){if(!opt.resume)a.currentTime=0;a.play().catch(()=>{})}return}
  const song=SONGS[name];if(!song||!AU.ctx)return;
  const stepDur=60/song.bpm/2;
  const tracks=song.tracks.map(t=>{const ev=[];for(let i=0;i<t.n.length;i++){const v=t.n[i];if(typeof v==='number'){let l=1;while(t.n[(i+l)%t.n.length]==='-'&&l<t.n.length)l++;ev[i]={m:v,l}}}return{...t,ev,len:t.n.length}});
  const total=Math.max(...tracks.map(t=>t.len));
  const st={step:0,next:AU.ctx.currentTime+.08,song,tracks,stepDur,total};
  AU.seq=st;
  st.timer=setInterval(()=>{
    if(!AU.ctx||AU.seq!==st)return;
    while(st.next<AU.ctx.currentTime+.18){
      const when=st.next-AU.ctx.currentTime;
      for(const t of tracks){const e=t.ev[st.step%t.len];if(e){const f=440*Math.pow(2,(e.m-69)/12);tone(f,e.l*stepDur*.92,t.w,t.v,Math.max(0,when),0,AU.music)}}
      if(song.drums){noise(.04,st.step%2?0.05:0.1,Math.max(0,when),8000,'highpass',AU.music);if(st.step%4===0)tone(110,.12,'sine',.3,Math.max(0,when),45,AU.music)}
      st.step=(st.step+1)%(total*4);st.next+=stepDur;
    }
  },30);
}

const DQ_EXP=[0,16,28,49,87,130,195,292,438,751,809,1241,1706,2345,3224,3546,3901,4291,4720,5192,5711,6282,6910,7602,8362,9198,10118,11130,12243,13467,14814,16295,17925,19717,21689,23858,26244,28868,31755,34931,38424];

const DQ_MAXDMG=[[1,15],[5,40],[10,55],[16,90],[20,130],[30,238]];
function dqMax(lv){const A=DQ_MAXDMG;if(lv>=30)return 238+(lv-30)*11;for(let i=1;i<A.length;i++)if(lv<=A[i][0]){const[a,b]=[A[i-1],A[i]];return a[1]+(b[1]-a[1])*(lv-a[0])/(b[0]-a[0])}return 238}

function nearWalk(x,y){for(let r=0;r<6;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const xx=x+dx,yy=y+dy;if(yy<0||xx<0||yy>=F.map.h||xx>=F.map.w)continue;if(!solidAt(xx,yy)&&!(xx===F.px&&yy===F.py))return[xx,yy]}return[x,y]}

  const e=ESC[S.esc];if(!e)return;let sp=e.spawns[id];if(!sp)return;
  if(sp==='auto'){const cells=[];F.map.rows.forEach((r,y)=>r.forEach((c,x)=>{if(!SOLID.has(c)&&Math.abs(x-F.px)+Math.abs(y-F.py)>=9)cells.push([x,y])}));sp=[];for(let i=0;i<3&&cells.length;i++)sp.push(cells[Math.floor(hash(i,7,3)*cells.length)])}

function bfsStep(n,tx,ty){ // 壁を避けて プレイヤーへの最短の一歩を探す
  const W=F.map.w,H=F.map.h,prev=new Int32Array(W*H).fill(-1),start=n.y*W+n.x,goal=ty*W+tx;prev[start]=start;const q=[start];let found=false;
  for(let qi=0;qi<q.length&&qi<4000;qi++){const c=q[qi];if(c===goal){found=true;break}const cx=c%W,cy=(c/W)|0;

function followerEnts(){
  const out=[];if(!F.map||F.map.sea||S.hideParty)return out;const ks=partyList().slice(1);
  ks.forEach((k,i)=>{const a=F.trail[i],b=F.trail[i+1]||a;if(!a)return;
    let x=a.x,y=a.y;if(F.moving&&b){x=lerp(b.x,a.x,F.mt);y=lerp(b.y,a.y,F.mt)}
    if(Math.abs(x-F.px)<.01&&Math.abs(y-F.py)<.01&&!F.moving)return;
    const dir=b&&(b.x!==a.x||b.y!==a.y)?(a.x>b.x?'right':a.x<b.x?'left':a.y>b.y?'down':'up'):a.dir||'down';
    out.push({f:k,x:x*TS,y:y*TS,dir})});
  return out}

function makeCarryCode(){
  const pk=k=>{const a=actorOf(k);return a?{lv:a.lv,exp:a.exp,mhp:a.mhp,mmp:a.mmp,def:a.def,pts:a.pts,mg:a.magics,sl:a.slots}:null};
  const data={v:2,lv:P.lv,exp:P.exp,mhp:P.mhp,mmp:P.mmp,batk:P.batk,bdef:P.bdef,w:P.weapon,wb:P.wbag,ar:P.armor,sh:P.shield,g:P.gold,it:P.items,sk:P.skills,mg:P.magics,es:P.eqSkill,em:P.eqMagic,pts:P.pts,b:pk('banica'),c:pk('celes'),nick:S.flags.nick||'バニカ',chess:!!S.flags.chessWin};
  const json=JSON.stringify(data);const bytes=new TextEncoder().encode(json);let bin='';bytes.forEach(c=>bin+=String.fromCharCode(c));
  let sum=0;for(let i=0;i<json.length;i++)sum=(sum*31+json.charCodeAt(i))>>>0;
  return 'JIL2-'+btoa(bin).replace(/=+$/,'')+'-'+sum.toString(36).toUpperCase();
}
function showCarryCode(){return new Promise(res=>{
  const code=makeCarryCode();const w=document.createElement('div');w.id='carry';w.className='win';
  w.innerHTML=`<b>第三部への 引き継ぎコード</b><p>第三部（ディスク2）を はじめるときに、このコードを 貼りつけてください。</p><textarea readonly></textarea><div class="btns"><button type="button" class="cp">コピーする</button><button type="button" class="cl">とじる</button></div>`;
  w.querySelector('textarea').value=code;$('#app').appendChild(w);
  const close=()=>{popUI(h);w.remove();res()};
  w.querySelector('.cp').addEventListener('click',async e=>{e.stopPropagation();try{await navigator.clipboard.writeText(code);w.querySelector('.cp').textContent='コピーしました'}catch(_){const ta=w.querySelector('textarea');ta.select();try{document.execCommand('copy');w.querySelector('.cp').textContent='コピーしました'}catch(__){}}});
  w.querySelector('.cl').addEventListener('click',e=>{e.stopPropagation();close()});
  w.addEventListener('pointerdown',e=>e.stopPropagation());
  const h=a=>{if(a==='cancel'||a==='menu')close()};pushUI(h)})}

function encounterCheck(){
  if(S.esc)return;const t=tileAt(F.px,F.py);if(!(F.map.enc||'.Fh:').includes(t))return;
  F.stepsSince++;if(F.stepsSince<5)return;
  let rate=t==='F'?.13:t===':'?.04:.08;
  if(S.step===4&&S.slimes<3)rate=.16;
  if(Math.random()>rate)return;F.stepsSince=0;
  const far=F.px>=13;const grp=pick(F.map.encT?ENC[F.map.encT]:S.step>=14?ENC.late:far?ENC.far:S.step>=10?ENC.nearNight:ENC.near);
  run(async()=>{const r=await doBattle({enemies:grp,bg:F.map.bg||(F.map.tint==='cave'?'cave':(t==='F'||F.map.id==='verde')?'forest':'field')});await afterNormal(r,grp)});
}

let BS=null; // battle state
function startBattle(cfg){
  return new Promise(res=>{
    if(!initBattle3D()){res({result:'win',exp:0,gold:0});return}
    const ar=buildArena(areaBg(cfg.bg||'field'));
    const pl=makeJilFF7();ar.sc.add(pl.root);
    BS={cfg,res,sc:ar.sc,props:ar.props,half:ar.half,t:0,slow:0,hitstop:0,shake:0,ended:false,fx:[],pops:[],
      pl:{m:pl,pos:V3(0,0,3.2),face:Math.PI,state:'idle',st:0,combo:0,queued:false,hitDone:false,guardStart:-9,dodgeStart:-9,dodgeDir:V3(),guarding:false,empower:0,vel:V3(),walk:0,skillHit:new Set(),justUsed:false,buf:{}},
      enemies:[],camT:V3(0,0,0),swCount:0,tut:null,paused:false,results:{exp:0,gold:0,names:[]}};
    const list=cfg.enemies;const n=list.length;
    list.forEach((type,i)=>addEnemy(type,i,n));
    if(cfg.tutorial)BS.tut={step:0,moved:0,done:false,lastPos:V3(0,0,3.2),kind:cfg.tutorial};
    BT.scene=ar.sc;BS.proj=[];BS.wave=1;setupParty(cfg,pl);
    $('#battle').hidden=false;$('#bhud').hidden=false;$('#btut').hidden=true;
    $('#touch-battle').classList.add('show');
    BT.cam.position.set(0,8,12);BT.cam.lookAt(0,0,0);
    playMusic(cfg.music||(cfg.event==='swordsman'?'boss':'battle'));
    P.sp=cfg.tutorial?0:P.sp;
    fadeTo(0,350);
    if(cfg.title)banner(cfg.title,1500);
    else if(!cfg.tutorial&&!cfg.event)banner(BS.enemies.length>1?'魔物の群れが あらわれた！':`${BS.enemies[0].d.name}が あらわれた！`,1300);
    if(cfg.event==='swordsman')banner('黒衣の剣士',1400);
    if(cfg.tutorial)tutStep(0);
    BT.run=true;
  });
}

function battleUpdate(rdt){
  if(!BS){return}
  const b=BS;
  if(!b.paused&&!uiStack.length){
    if(consume('pause'))openPause();
  }
  if(b.paused||uiStack.length&&!b.ended){render3D();return}
  if(b.hitstop>0){b.hitstop-=rdt;render3D();return}
  const dt=rdt;b.t+=dt;
  const edt=b.slow>0?dt*.28:dt;if(b.slow>0){b.slow-=dt;if(b.slow<=0)$('#slowfx').style.opacity=0}
  if(!b.ended){updatePlayer(dt);for(const e of b.enemies)updateEnemy(e,edt);updateProj(dt);updateParty(dt)}
  separate();
  // fx
  for(let i=b.fx.length-1;i>=0;i--){const f=b.fx[i];f.t+=dt;const p=Math.min(1,f.t/f.life);f.upd&&f.upd(f,p,dt);if(p>=1){b.sc.remove(f.mesh);b.fx.splice(i,1)}}
  for(const pr of b.props){if(pr.light)pr.light.intensity=pr.base*(.75+Math.sin(b.t*11+pr.base)*.15+Math.random()*.15);if(pr.flame){pr.flame.scale.y=1+Math.sin(b.t*9+pr.ph)*.2;pr.flame.position.y+=Math.sin(b.t*7+pr.ph)*.003}}
  // camera
  const pl=b.pl;const alive=b.enemies.filter(e=>!e.dead);let tgt=pl.pos.clone();if(alive.length){const c=V3();alive.forEach(e=>c.add(e.pos));c.multiplyScalar(1/alive.length);tgt.lerp(c,.32)}
  b.camT.lerp(tgt,Math.min(1,dt*4));
  const portrait=VHd()>VWd();const ch=portrait?11:8.2,cz=portrait?11.5:9.6;
  BT.cam.position.set(b.camT.x,ch,b.camT.z+cz);BT.cam.lookAt(b.camT.x,.6,b.camT.z-.5);
  if(b.shake>0){b.shake-=dt;BT.cam.position.x+=rnd(-.15,.15);BT.cam.position.y+=rnd(-.12,.12)}
  if(!b.ended)checkEnd();
  render3D();
}

  const mus=b.cfg.tripleMusic&&b.cfg.tripleMusic[cur];if(mus)b.cfg.music=mus}

  let i=b.ci,found=false;for(let n=0;n<b.party.length;n++){i=(i+dir+b.party.length)%b.party.length;if(i!==b.ci&&ok(i)){found=true;break}}

  old.m.root.visible=false;b.ci=i;const pm=b.party[i];pl.m=pm.m;pm.m.root.visible=true;pl.buf=b.bufs[pm.k];pl.pos.copy(b.tri.pos[pm.k]);pl.vel=V3();

  pl.state='idle';pl.st=0;pl.combo=0;pl.queued=false;b.swCd=forced?.6:2.5;b.camT.copy(pl.pos);

function parseCarry(code){code=(code||'').trim().replace(/\s+/g,'');const m=code.match(/^JIL2-([A-Za-z0-9+/]+)-([0-9A-Z]+)$/);if(!m)return null;
  try{let b64=m[1];while(b64.length%4)b64+='=';const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const json=new TextDecoder().decode(bytes);
    let sum=0;for(let i=0;i<json.length;i++)sum=(sum*31+json.charCodeAt(i))>>>0;if(sum.toString(36).toUpperCase()!==m[2])return null;const d=JSON.parse(json);return d&&d.lv?d:null}catch(e){return null}}
function askCarryCode(){return new Promise(res=>{

  w.innerHTML=`<b>引き継ぎコード</b><p style="margin:4px 0">第二部の さいごに 表示された コード（JIL2-… ではじまる）を 貼りつけてください。</p><textarea placeholder="JIL2-..." style="height:64px"></textarea><p class="err" style="color:var(--danger);min-height:1.2em;margin:2px 0"></p><div class="btns"><button type="button" class="ps">貼り付け</button><button type="button" class="ok">はじめる</button><button type="button" class="cl">もどる</button></div>`;
  $('#app').appendChild(w);const ta=w.querySelector('textarea'),err=w.querySelector('.err');
  for(const ev of['keydown','keyup','pointerdown'])w.addEventListener(ev,e=>e.stopPropagation());
  const vv=window.visualViewport;const fit=()=>{if(vv)w.style.top=(vv.offsetTop+8)+'px'};if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  const done=v=>{if(vv){vv.removeEventListener('resize',fit);vv.removeEventListener('scroll',fit)}ta.blur();w.remove();window.scrollTo(0,0);res(v)};
  const tryStart=()=>{const d=parseCarry(ta.value);if(!d){sfx('cancel');err.textContent='コードが 正しくないようです。もう一度 確かめてください。';return}sfx('ok');done(d)};
  w.querySelector('.ps').onclick=async()=>{try{const t=await navigator.clipboard.readText();ta.value=(t||'').trim();ta.blur();err.textContent=t?'':'クリップボードが 空です。';if(t&&parseCarry(ta.value)){err.style.color='var(--gold)';err.textContent='コードを 読み込みました。「はじめる」を 押してください。'}}catch(e){err.textContent='貼り付けが 許可されませんでした。下の 枠を 長押しして 貼り付けてください。';ta.focus()}};
  w.querySelector('.cl').onclick=()=>{sfx('cancel');done(null)};
  w.querySelector('.ok').onclick=tryStart;
})}

/* 的当て：動く印が 真ん中に来たときに 決定 */
function targetGame(){return new Promise(res=>{
  const w=document.createElement('div');w.className='win';w.style.cssText='position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:58;width:min(calc(100% - 32px),460px);padding:14px 18px;box-sizing:border-box;text-align:center;font-size:16px';
  w.innerHTML='<b style="color:var(--gold)">的当て</b>　命中 <span class="h">0</span>／3<div style="position:relative;height:30px;margin:12px 0;background:#0b0c18;border:2px solid var(--line);border-radius:6px;overflow:hidden"><i style="position:absolute;left:43%;width:14%;top:0;bottom:0;background:rgba(255,80,80,.55)"></i><i class="mk" style="position:absolute;top:0;bottom:0;width:6px;background:#fff"></i></div><div class="tx">決定（タップ）で 投げる！　のこり 3回</div>';
  $('#app').appendChild(w);const mk=w.querySelector('.mk');let t0=performance.now(),pos=0,left=3,hits=0,lock=false,raf;
  const tick=now=>{const t=(now-t0)/1000;pos=(Math.sin(t*(3.2+(3-left)*.9))+1)/2;mk.style.left=`calc(${pos*100}% - 3px)`;raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
  const throwIt=()=>{if(lock)return;lock=true;const hit=Math.abs(pos-.5)<.075;left--;if(hit){hits++;sfx('crit')}else sfx('cancel');
    w.querySelector('.h').textContent=hits;w.querySelector('.tx').textContent=(hit?'命中！':'はずれ……')+(left?'　のこり '+left+'回':'');
    setTimeout(()=>{lock=false;if(!left){cancelAnimationFrame(raf);removeEventListener('keydown',kd,true);w.remove();res(hits)}},700)};
  const kd=e=>{if(['Enter','Space','KeyZ'].includes(e.code)){e.preventDefault();e.stopPropagation();throwIt()}};
  addEventListener('keydown',kd,true);w.addEventListener('pointerdown',e=>{e.stopPropagation();throwIt()});
})}

/* ================= TITLE / BOOT ================= */
async function titleScreen(){
  if(DISK===2)return titleScreen3();
  mode='title';$('#title').hidden=false;$('#hud').hidden=true;
  const sv=loadSave();if(sv&&sv.S&&sv.S.step>=32)$('#title .sub2').textContent='第二部 ― 星の海と紅き魔女 ―';
  const host=$('#titleMenu');host.innerHTML='';
  const items=[{label:'はじめから'},{label:'つづきから',disabled:!sv},{label:'そうさ方法'}];
  while(true){
    const pr=selectList({items,cancel:false,pos:'inline'});host.appendChild(selectList.last);
    const i=await pr;audioInit();if(i!==2)tryLandscape();
    if(i===2){await showControls();continue}
    $('#title').hidden=true;
    if(i===3){await trialDate();return}
    if(i===0){newGame();await opening()}
    else{mode='field';applySave(sv);$('#touch-field').classList.add('show');updateHUD();await fadeTo(0,500)}
    return;
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  pollPad();
  if(mode==='field'){fieldUpdate(dt);fieldRender()}
  else if(mode==="battle"&&BS&&BT.run){battleUpdate(Math.min(dt,.034))}
  edges.clear();
  requestAnimationFrame(loop);
}

});
